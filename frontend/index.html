<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Студенты</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Список студентов</h1>
        
        <div class="filters">
            <div class="filter-group">
                <label for="group-select">Учебная группа:</label>
                <select id="group-select">
                    <option value="">Все группы</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label>
                    <input type="checkbox" id="currently-study-checkbox">
                    Обучается в данный момент
                </label>
            </div>
            
            <div class="filter-group">
                <label>
                    <input type="checkbox" id="has-contacts-checkbox">
                    Есть контакты
                </label>
            </div>
            
            <button id="apply-filters">Применить фильтры</button>
        </div>

        <table id="students-table">
            <thead>
                <tr>
                    <th>Имя</th>
                    <th>Фамилия</th>
                    <th>Группа</th>
                    <th>Контакты (Email / Телефон / TG)</th>
                </tr>
            </thead>
            <tbody>
                <!-- Данные будут загружены через JS -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
